services:
  db:
    image: postgres:15
    command: postgres -c shared_buffers=256MB -c max_connections=200
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Jerusalem
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: Uncomment to run worker in Docker (or run it locally instead)
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   restart: unless-stopped
  #   command: celery -A src.backend.celery_worker.celery worker --loglevel=info --concurrency=2
  #   environment:
  #     TZ: Asia/Jerusalem
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_DB: 0
  #   env_file: .env
  #   volumes:
  #     - ./src:/app/src:ro
  #     - ./migrations:/app/migrations:ro
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     db:
  #       condition: service_healthy

volumes:
  pg_data_dev:
  redis_data_dev:

