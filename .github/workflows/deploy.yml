name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/photo-app:latest
      
      - name: Copy config files to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }} 
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "docker-compose.yml,Caddyfile"
          target: "/home/ubuntu/"
      
      - name: Deploy on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script: |
            cd /home/ubuntu
            
            echo "Pulling latest image..."
            docker compose pull web
            
            echo "Updating containers..."
            docker compose up -d --remove-orphans
            
            sleep 5
            
            echo "Running migrations..."
            docker compose exec web ./migrate.sh apply || echo "Migration failed or script not found"
            
            docker image prune -f
            
            echo "Deployment successful!"