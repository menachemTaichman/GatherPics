name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.filter.outputs.needs-build }}
      needs-migration: ${{ steps.filter.outputs.needs-migration }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            needs-build:
              - 'Dockerfile*'
              - 'requirements.txt'
              - 'package.json'
              - 'package-lock.json'
              - 'src/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'vite.config.js'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'public/**'
              - 'index.html'
            needs-migration:
              - 'migrations/*.py'
              - '!migrations/sql/**'

  deploy:
    runs-on: ubuntu-latest
    needs: check-changes
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Docker image
        if: needs.check-changes.outputs.needs-build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/photo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Copy config files to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }} 
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "docker-compose.yml,Caddyfile"
          target: "/home/ubuntu/"
      
      - name: Deploy on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script: |
            set -e  # Exit on any error
            cd /home/ubuntu
            
            if [ "${{ needs.check-changes.outputs.needs-build }}" == "true" ]; then
              echo "Pulling latest image..."
              docker compose pull web
            else
              echo "Skipping image pull (no build needed)"
            fi
            
            echo "Updating containers..."
            docker compose up -d --remove-orphans
            
            # Step 1: Drop database logic layer (functions, views, triggers)
            echo "Step 1: Dropping database logic layer..."
            if ! docker compose exec -T web python scripts/recreate_db_logic.py --drop-only; then
              echo "ERROR: Failed to drop database logic layer"
              exit 1
            fi
            
            # Step 2: Apply schema migrations (tables, indexes, constraints)
            if [ "${{ needs.check-changes.outputs.needs-migration }}" == "true" ]; then
              echo "Waiting for container to be ready..."
              sleep 3
              echo "Step 2: Applying schema migrations..."
              if ! docker compose exec -T web ./migrate.sh apply; then
                echo "ERROR: Schema migration failed"
                exit 1
              fi
            else
              echo "Step 2: Skipping schema migrations (no migration files changed)"
            fi
            
            # Step 3: Recreate database logic layer (functions, views, triggers)
            echo "Step 3: Recreating database logic layer..."
            if ! docker compose exec -T web python scripts/recreate_db_logic.py; then
              echo "ERROR: Failed to recreate database logic layer"
              exit 1
            fi
            
            # Only prune images if we pulled a new one (non-critical cleanup step)
            if [ "${{ needs.check-changes.outputs.needs-build }}" == "true" ]; then
              docker image prune -f || echo "Warning: Image prune failed (non-critical)"
            fi
            
            echo "Deployment successful!"