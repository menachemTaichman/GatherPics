name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t metaich/photo-app:latest .
      
      - name: Save Docker image
        run: |
          docker save metaich/photo-app:latest | gzip > app-image.tar.gz
      
      - name: Copy files to Lightsail instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "app-image.tar.gz,docker-compose.yml"
          target: "/tmp/"
      
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script: |
            # Load the Docker image
            docker load < /tmp/app-image.tar.gz
            rm /tmp/app-image.tar.gz
            
            # Copy docker-compose.yml to deployment directory
            DEPLOY_DIR="$HOME/app"
            mkdir -p "$DEPLOY_DIR"
            cp /tmp/docker-compose.yml "$DEPLOY_DIR/"
            cd "$DEPLOY_DIR"
            
            # Stop existing services
            docker-compose down || true
            
            # Start database first (for migrations)
            docker-compose up -d db
            
            # Wait for database to be ready
            echo "Waiting for database to be ready..."
            sleep 5
            
            # Run database migrations
            docker-compose run --rm web ./migrate.sh || true
            
            # Start all services
            docker-compose up -d
            
            # Clean up old images
            docker image prune -f

